# Generated at container start — loopback backend for tproxy-server (:2398).
[general]
use_middle_proxy = true
fast_mode = true
prefer_ipv6 = false
log_level = "normal"

[general.modes]
classic = __TELEMT_CLASSIC__
secure = __TELEMT_SECURE__
tls = false

[server]
port = 2398
listen_addr_ipv4 = "127.0.0.1"

[server.api]
enabled = false

[access.users]
web = "__TPROXY_SECRET_HEX__"
